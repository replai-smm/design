# orbit.yaml — договор дизайн-системы с orbit: одна строка — одна команда `sh -c` из корня клона. ORBIT_SHA — выпускаемый коммит,
# ORBIT_DEPLOY_KEY — путь к ключу выкатки; задаёт orbit.
# Прод ДС — теги vX.Y.Z на GitHub (продукты ставят пакет по архиву тега); выпуск, номер, проверка и откат — release.mjs, одно место.
# Ключ выкатки — деплой-ключ репо: правила репо дают ему только создать тег (ветки — только админ, теги не двигает никто). VPS нет.
# Облик — снимки react/visual/baseline: правка облика переписывает ровно ушедшие за допуск кадры (snapshot), их хозяин смотрит до
# выпуска (eyes; look — ссылки на новые кадры в ветке).
setup: { [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --prefer-offline --no-audit --no-fund; } && npx playwright install chromium
check_fast: export IBM_TELEMETRY_DISABLED=true; node build.mjs && npm run typecheck && npm run lint && npm test
check: export IBM_TELEMETRY_DISABLED=true; npm run check
snapshot: export IBM_TELEMETRY_DISABLED=true; node build.mjs && npm run storybook:build && npm run visual:update -w react
deploy: node release.mjs deploy
watch: node release.mjs watch
version: node release.mjs version
rollback: node release.mjs rollback
look: git -c core.quotepath=off diff --name-only origin/main HEAD -- react/visual/baseline | sed "s|^|https://github.com/replai-smm/design/blob/${ORBIT_SHA:?}/|"
red: orbit.yaml, release.mjs, .github/, package.json, package-lock.json, matrix.yaml, /lint/, /visual/run.mjs, /visual/compare.mjs, /visual/anatomy.mjs
eyes: /react/visual/baseline/
