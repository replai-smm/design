# design — пишет `npx design init` (пакет @replai-smm/design): правка руками — красный `design init --check`, следующий init её затрёт.
# На PR и на push в main: интерфейс держит дизайн-систему. Красный шаг блокирует слив (karta gate смотрит все проверки PR):
# `design check` — только роли и шкалы, полки `Экраны/SCR-NN …`, нет своего компонента с именем ДС, против origin/main;
# `design widths` — Storybook собран, и на 360 · 1024 · 1280 · 1920 ни один экран не шире окна и не режет текст.
# Проверка идёт один раз на голову и только когда задето приложение (RSMM-141): задание `changes` читает список файлов, и
# `design` без правок приложения честно пропущено (skipped) — karta gate считает пропуск пройденным, отсутствие проверки —
# красным. Fail-closed: список не прочитан, урезан или пуст, `changes` упало — `design` идёт.
name: design
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # список файлов PR — задание changes
concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: changes · задето ли приложение
    runs-on: [self-hosted, rsmm-pool]
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            // Приложение задето: его папка, корневые package*.json (Playwright сторожа ширин), сам этот workflow.
            // Приложение — корень репо: задето всегда. Сомнение — в пользу проверки.
            const app = '__APP__'
            const touches = (f) =>
              app === '.' || f.startsWith(`${app}/`) || ['package.json', 'package-lock.json', '.github/workflows/design.yml'].includes(f)
            let files = null
            let truncated = false
            try {
              const { owner, repo } = context.repo
              if (context.eventName === 'pull_request') {
                const list = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: context.payload.pull_request.number, per_page: 100 })
                files = list.map((f) => f.filename)
                truncated = files.length >= 3000 // потолок API списка файлов PR
              } else if (context.payload.before && !/^0+$/.test(context.payload.before)) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${context.payload.before}...${context.sha}` })
                files = (data.files ?? []).map((f) => f.filename)
                truncated = files.length >= 300 // потолок API сравнения
              }
            } catch (err) {
              core.warning(`список файлов не прочитан: ${err.message} — design идёт`)
            }
            const doubt = !files || files.length === 0 || truncated
            const touched = doubt || files.some(touches)
            core.setOutput('app', String(touched))
            core.notice(doubt ? 'список файлов не прочитан, урезан или пуст — design идёт' : touched ? `приложение ${app} задето — design идёт` : `приложение ${app} не задето — design пропущен`)

  design:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false') }}
    runs-on: [self-hosted, rsmm-pool]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm ci
        working-directory: __APP__
        run: $(command -v rsmm-npm-ci || echo npm ci) --prefer-offline --no-audit --no-fund
      # root-ci:begin
      - name: npm ci (корень репо — для Playwright сторожа ширин)
        working-directory: .
        run: $(command -v rsmm-npm-ci || echo npm ci) --prefer-offline --no-audit --no-fund
      # root-ci:end
      - name: design init --check
        run: node __APP__/node_modules/@replai-smm/design/bin/design.mjs init --check
      - name: design check
        run: node __APP__/node_modules/@replai-smm/design/bin/design.mjs check --base "$BASE"
      # widths:begin
      - name: storybook build
        working-directory: __APP__
        run: npm run storybook:build
      - name: playwright (браузер сторожа ширин; уже стоит — шаг мгновенный)
        working-directory: __ROOT__
        run: npx playwright install chromium-headless-shell
      - name: design widths
        run: node __APP__/node_modules/@replai-smm/design/bin/design.mjs widths
      # widths:end
