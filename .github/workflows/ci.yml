# CI дизайн-системы (репо design). Задача лёгкая и без секретов — идёт на раннере GitHub (ubuntu-latest); выбор —
# переменная репозитория CI_RUNNER (нет — ubuntu-latest), как у process: вернуть на пул ПК — `gh variable set CI_RUNNER
# -R replai-smm/design --body '["self-hosted","rsmm-pool"]'`, назад — `gh variable delete CI_RUNNER -R replai-smm/design`.
# Что держит `npm run check`: сторож «только роли и шкалы» и полки = уровни (`--kind ds --strict`), типы, тесты (контраст,
# формы, сборка, состав пакета, устройство по реестру с приманками, a11y axe в обеих темах, поведение компонентов,
# истории на каждое состояние) и облик: каждая история × обе темы × 390 и 1280 против эталонов react/visual/baseline
# с анатомией по реестру. Эталоны сняты Chromium Playwright 1.63 на Linux; на другом раннере облик сверяется тем же.
# Слова статусов против закона Карты сверяет process на закреплённом теге этого пакета; секретов нет.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ДС · типы, сторож, тесты, Storybook
    # репо публичное, а раннер — пул ПК: PR из форка здесь не исполняется никогда (чужой код на ПК)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    env:
      IBM_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: $(command -v rsmm-npm-ci || echo npm ci) --prefer-offline --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: runner.environment == 'github-hosted'
      - run: npx playwright install chromium
        if: runner.environment != 'github-hosted'
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: react/visual/out
          if-no-files-found: ignore
          retention-days: 7
