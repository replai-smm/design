# Матрица облика — одна на все продукты (договор schema/defs/matrix.json, условие G47).
# Слово owner'а 02.10 (вопрос 5, по рекомендации): светлая и тёмная × 390 и 1280;
# все состояния — на 390 в светлой, «обычное» — во всех четырёх клетках.
# Продукт сужает матрицу в karta.yaml → look только планом под «делаем».
schema: 3
doc: матрица
themes: [светлая, тёмная]
widths: [390, 1280]
states: [обычное, загрузка, ошибка, первый запуск, всё сделано, ничего не найдено, нет доступа, много]
max_diff_pixels: 50
active:
  - { state: обычное, themes: [светлая, тёмная], widths: [390, 1280] }
  - { state: загрузка, themes: [светлая], widths: [390] }
  - { state: ошибка, themes: [светлая], widths: [390] }
  - { state: первый запуск, themes: [светлая], widths: [390] }
  - { state: всё сделано, themes: [светлая], widths: [390] }
  - { state: ничего не найдено, themes: [светлая], widths: [390] }
  - { state: нет доступа, themes: [светлая], widths: [390] }
  - { state: много, themes: [светлая], widths: [390] }
